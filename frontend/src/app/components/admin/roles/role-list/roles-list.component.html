<div class="admin-page">
  <div class="admin-content">
    <div class="admin-header">
      <h2>Roles</h2>
    </div>

    <button mat-flat-button color="primary" routerLink="/admin/roles/new">
      Create New Role
    </button>

    <div *ngIf="loading">Loading...</div>
    <div *ngIf="error">{{ error }}</div>

    <mat-table border="1" cellpadding="8" *ngIf="!loading && roles.length > 0">
      <thead>
        <tr>
          <th>Name</th>
          <th>Description</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let r of roles">
          <td>{{ r.name }}</td>
          <td>{{ r.description }}</td>
          <td>
            <a [routerLink]="['/admin/roles', r.id]">
              <button>Edit</button>
            </a>

            <button (click)="deleteRole(r.id)">Delete</button>
          </td>
        </tr>
      </tbody>
    </mat-table>

    <div *ngIf="!loading && roles.length === 0">No roles found.</div>
  </div>
</div>
