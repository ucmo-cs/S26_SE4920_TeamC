<div class="admin-page">
  <div class="admin-content">
    <div class="admin-header">
      <h2>{{ id ? "Edit Role" : "Create Role" }}</h2>
    </div>
    <mat-card class="admin-card">
      <mat-card-content>
        <mat-form-field appearance="outline" class="theme-field">
          <mat-label>Role Name</mat-label>
          <input type="text" [formControl]="form.controls.name" />

          <mat-label>Description</mat-label>
          <input type="text" [formControl]="form.controls.description" />

          <h3>Permissions</h3>
          <div *ngFor="let p of permissions">
            <mat-label>
              <input
                type="checkbox"
                [checked]="(form.value.permissionCodes || []).includes(p.code)"
                (change)="onPermissionChange(p.code, $event)"
              />
              {{ p.label || p.code }}
            </mat-label>
          </div>

          <button type="submit" [disabled]="form.invalid">Save</button>
          <a routerLink="/admin/roles">Cancel</a>
        </mat-form-field>
      </mat-card-content>
    </mat-card>
  </div>
</div>
