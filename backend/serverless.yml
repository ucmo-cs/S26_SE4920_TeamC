service: senior-project-template
frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs20.x
  region: us-east-1

plugins:
  - serverless-offline

resources:
  Resources:
    UsersTable:
      Type: AWS::DynamoDB::Table
      Properties:
        AttributeDefinitions:
          [
            { 'AttributeName': 'uuid', 'AttributeType': 'S' },
            { 'AttributeName': 'startDate', 'AttributeType': 'S' },
            { 'AttributeName': 'teamName', 'AttributeType': 'S' },
          ]
        KeySchema: [{ 'AttributeName': 'uuid', 'KeyType': 'HASH' }]
        GlobalSecondaryIndexes:
          [
            {
              'IndexName': 'StartDateIndex',
              'KeySchema': [{ 'AttributeName': 'startDate', 'KeyType': 'HASH' }],
              'Projection': { 'ProjectionType': 'ALL' },
            },
            {
              'IndexName': 'TeamNameIndex',
              'KeySchema': [{ 'AttributeName': 'teamName', 'KeyType': 'HASH' }],
              'Projection': { 'ProjectionType': 'ALL' },
            }
          ]
        BillingMode: PAY_PER_REQUEST
        TableName: users
        StreamSpecification:
          StreamViewType: NEW_AND_OLD_IMAGES

    ProjectsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        AttributeDefinitions: [{ 'AttributeName': 'uuid', 'AttributeType': 'S' }]
        KeySchema: [{ 'AttributeName': 'uuid', 'KeyType': 'HASH' }]
        BillingMode: PAY_PER_REQUEST
        TableName: projects
        StreamSpecification:
          StreamViewType: NEW_AND_OLD_IMAGES

    DailyStatusTable:
      Type: AWS::DynamoDB::Table
      Properties:
        AttributeDefinitions:
          [
            { 'AttributeName': 'uuid', 'AttributeType': 'S' },
            { 'AttributeName': 'userId', 'AttributeType': 'S' },
            { 'AttributeName': 'date', 'AttributeType': 'S' }
          ]
        KeySchema: [{ 'AttributeName': 'uuid', 'KeyType': 'HASH' }]
        GlobalSecondaryIndexes:
          [
            {
              'IndexName': 'userDateIndex',
              'KeySchema':
                [
                  { 'AttributeName': 'userId', 'KeyType': 'HASH' },
                  { 'AttributeName': 'date', 'KeyType': 'RANGE' }
                ],
              'Projection': { 'ProjectionType': 'ALL' },
            },
            {
              'IndexName': 'dateIndex',
              'KeySchema': [{ 'AttributeName': 'date', 'KeyType': 'HASH' }],
              'Projection': { 'ProjectionType': 'ALL' },
            }
          ]
        BillingMode: PAY_PER_REQUEST
        TableName: dailyStatus
        StreamSpecification:
          StreamViewType: NEW_AND_OLD_IMAGES

    CertificationsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        AttributeDefinitions:
          [
            { 'AttributeName': 'uuid', 'AttributeType': 'S' },
            { 'AttributeName': 'userId', 'AttributeType': 'S' }
          ]
        KeySchema: [{ 'AttributeName': 'uuid', 'KeyType': 'HASH' }]
        GlobalSecondaryIndexes:
          [
            {
              'IndexName': 'userIdIndex',
              'KeySchema': [{ 'AttributeName': 'userId', 'KeyType': 'HASH' }],
              'Projection': { 'ProjectionType': 'ALL' },
            }
          ]
        BillingMode: PAY_PER_REQUEST
        TableName: certifications
        StreamSpecification:
          StreamViewType: NEW_AND_OLD_IMAGES

    TrainingsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        AttributeDefinitions:
          [
            { 'AttributeName': 'uuid', 'AttributeType': 'S' },
            { 'AttributeName': 'userId', 'AttributeType': 'S' }
          ]
        KeySchema: [{ 'AttributeName': 'uuid', 'KeyType': 'HASH' }]
        GlobalSecondaryIndexes:
          [
            {
              'IndexName': 'userIdIndex',
              'KeySchema': [{ 'AttributeName': 'userId', 'KeyType': 'HASH' }],
              'Projection': { 'ProjectionType': 'ALL' },
            }
          ]
        BillingMode: PAY_PER_REQUEST
        TableName: trainings
        StreamSpecification:
          StreamViewType: NEW_AND_OLD_IMAGES

functions:
  login:
    handler: src/handlers/login.handler
    events:
      - http:
          path: login
          method: post
          cors: true

  importData:
    handler: src/handlers/import-data.handler
    environment:
      USERS_TABLE: users
      PROJECTS_TABLE: projects
      DAILY_STATUS_TABLE: dailyStatus
    events:
      - http:
          path: import-data
          method: post
          cors: true

  # -------------------------
  # CERTIFICATIONS CRUD
  # -------------------------
  listCertifications:
    handler: src/handlers/certifications.list
    environment:
      CERTIFICATIONS_TABLE: certifications
    events:
      - http:
          path: certifications
          method: get
          cors: true

  createCertification:
    handler: src/handlers/certifications.create
    environment:
      CERTIFICATIONS_TABLE: certifications
    events:
      - http:
          path: certifications
          method: post
          cors: true

  updateCertification:
    handler: src/handlers/certifications.update
    environment:
      CERTIFICATIONS_TABLE: certifications
    events:
      - http:
          path: certifications/{uuid}
          method: put
          cors: true

  deleteCertification:
    handler: src/handlers/certifications.remove
    environment:
      CERTIFICATIONS_TABLE: certifications
    events:
      - http:
          path: certifications/{uuid}
          method: delete
          cors: true

  # -------------------------
  # TRAININGS CRUD
  # -------------------------
  listTrainings:
    handler: src/handlers/trainings.list
    environment:
      TRAININGS_TABLE: trainings
    events:
      - http:
          path: trainings
          method: get
          cors: true

  createTraining:
    handler: src/handlers/trainings.create
    environment:
      TRAININGS_TABLE: trainings
    events:
      - http:
          path: trainings
          method: post
          cors: true

  updateTraining:
    handler: src/handlers/trainings.update
    environment:
      TRAININGS_TABLE: trainings
    events:
      - http:
          path: trainings/{uuid}
          method: put
          cors: true

  deleteTraining:
    handler: src/handlers/trainings.remove
    environment:
      TRAININGS_TABLE: trainings
    events:
      - http:
          path: trainings/{uuid}
          method: delete
          cors: true