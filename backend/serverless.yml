service: senior-project-template
frameworkVersion: "3"

provider:
  name: aws
  runtime: nodejs20.x
  region: us-east-1
  environment:
    DYNAMODB_ENDPOINT: ${self:custom.dynamodbEndpoints.${sls:stage}}
    USERS_TABLE: users
    PROJECTS_TABLE: projects
    DAILY_STATUS_TABLE: dailyStatus
    AUTH_TABLE: authorization
    JWT_SECRET: ${env:JWT_SECRET, 'dev-secret-key-change-in-production'}


plugins:
  - serverless-dynamodb
  - serverless-offline

custom:
  dynamodbEndpoints:
    dev: "http://localhost:8000"
    prod: "https://dynamodb.us-east-1.amazonaws.com"
  dynamodb:
    stage: dev
    start:
      host: 127.0.0.1
      port: 8000
      docker: false
      migrate: true

resources:
  Resources:
    UsersTable:
      Type: AWS::DynamoDB::Table
      Properties:
        AttributeDefinitions:
          [
            { "AttributeName": "uuid", "AttributeType": "S" },
            { "AttributeName": "startDate", "AttributeType": "S" },
            { "AttributeName": "teamName", "AttributeType": "S" },
          ]
        KeySchema: [{ "AttributeName": "uuid", "KeyType": "HASH" }]
        GlobalSecondaryIndexes:
          [
            {
              "IndexName": "StartDateIndex",
              "KeySchema":
                [{ "AttributeName": "startDate", "KeyType": "HASH" }],
              "Projection": { "ProjectionType": "ALL" },
            },
            {
              "IndexName": "TeamNameIndex",
              "KeySchema": [{ "AttributeName": "teamName", "KeyType": "HASH" }],
              "Projection": { "ProjectionType": "ALL" },
            },
          ]
        BillingMode: PAY_PER_REQUEST
        TableName: users
        StreamSpecification:
          StreamViewType: NEW_AND_OLD_IMAGES
    ProjectsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        AttributeDefinitions:
          [{ "AttributeName": "uuid", "AttributeType": "S" }]
        KeySchema: [{ "AttributeName": "uuid", "KeyType": "HASH" }]
        BillingMode: PAY_PER_REQUEST
        TableName: projects
        StreamSpecification:
          StreamViewType: NEW_AND_OLD_IMAGES
    DailyStatusTable:
      Type: AWS::DynamoDB::Table
      Properties:
        AttributeDefinitions:
          [
            { "AttributeName": "uuid", "AttributeType": "S" },
            { "AttributeName": "userId", "AttributeType": "S" },
            { "AttributeName": "date", "AttributeType": "S" },
          ]
        KeySchema: [{ "AttributeName": "uuid", "KeyType": "HASH" }]
        GlobalSecondaryIndexes:
          [
            {
              "IndexName": "userDateIndex",
              "KeySchema":
                [
                  { "AttributeName": "userId", "KeyType": "HASH" },
                  { "AttributeName": "date", "KeyType": "RANGE" },
                ],
              "Projection": { "ProjectionType": "ALL" },
            },
            {
              "IndexName": "dateIndex",
              "KeySchema": [{ "AttributeName": "date", "KeyType": "HASH" }],
              "Projection": { "ProjectionType": "ALL" },
            },
          ]
        BillingMode: PAY_PER_REQUEST
        TableName: dailyStatus
        StreamSpecification:
          StreamViewType: NEW_AND_OLD_IMAGES
    AuthTable:
      Type: AWS::DynamoDB::Table
      Properties:
        AttributeDefinitions:
          [
            { "AttributeName": "uuid", "AttributeType": "S" },
          ]
        KeySchema: [{ "AttributeName": "uuid", "KeyType": "HASH" }]
        TableName: authorization
        BillingMode: PAY_PER_REQUEST
        StreamSpecification:
          StreamViewType: NEW_AND_OLD_IMAGES
functions:
  login:
    handler: src/handlers/login.handler
    events:
      - http:
          path: login
          method: post
          cors: true

  auth:
    handler: src/handlers/auth.handler
    events:
      - http:
          path: auth
          method: get
          cors: true

  users:
    handler: src/handlers/users.handler
    events:
      - http:
          path: users
          method: get
          cors: true

  userById:
    handler: src/handlers/user.handler
    events:
      - http:
          path: users/{uuid}
          method: get
          cors: true

  updateUserRoles:
    handler: src/handlers/update-user-roles.handler
    events:
      - http:
          path: users/{uuid}/roles
          method: put
          cors: true

  createUser:
    handler: src/handlers/create-user.handler
    events:
      - http:
          path: user/create-user
          method: post
          cors: true

  projects:
    handler: src/handlers/projects.handler
    events:
      - http:
          path: projects
          method: get
          cors: true

  importData:
    handler: src/handlers/import-data.handler
    events:
      - http:
          path: import-data
          method: post
          cors: true
  postTimeOff:
    handler: src/handlers/post-time-off.handler
    events:
      - http:
          path: time-off
          method: post
          cors: true
  getTimeOff:
    handler: src/handlers/get-time-off.handler
    events:
      - http:
          path: time-off/{userId}
          method: get
          cors: true
